[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wadoe"
version = "0.1.0"
description = "WADOE: a generic soft Mixture-of-Experts research library."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Christian (Shimba-crypto)" }]
keywords = [
    "mixture-of-experts",
    "moe",
    "soft-routing",
    "routing",
    "transformers",
    "pytorch",
    "research",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "torch>=2.0",
    "numpy",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "build",
    "twine",
]

[project.urls]
Homepage = "https://github.com/Shimba-crypto/wadoe"
Repository = "https://github.com/Shimba-crypto/wadoe"
Issues = "https://github.com/Shimba-crypto/wadoe/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wadoe = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
